name: Windows EXE build and validation
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Fetch pinned upstream G3 migration tools
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/phicomm-io/iotcloud-community-firmware.git upstream
          git -C upstream checkout 1c9d2f373f0a9248d2360e03cf2a385c28532571
          New-Item -ItemType Directory -Path upstream-g3-migrate -Force | Out-Null
          Copy-Item upstream/tools/daikin_g3_migrate/init.py,upstream/tools/daikin_g3_migrate/enable.py,upstream/tools/daikin_g3_migrate/local_ota_server.py,upstream/tools/daikin_g3_migrate/local_gateway_responder.py,upstream/tools/daikin_g3_migrate/trigger.py upstream-g3-migrate/
          Copy-Item upstream/LICENSE upstream-g3-migrate/UPSTREAM-LICENSE -ErrorAction SilentlyContinue
          Set-Content upstream-g3-migrate/UPSTREAM-COMMIT.txt '1c9d2f373f0a9248d2360e03cf2a385c28532571'
      - name: Validate PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('prepare.ps1', 'start.ps1', 'stop.ps1')) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "Parse failed: $path - $errors" }
          }
      - name: Publish Windows x64 self-contained EXE
        shell: pwsh
        run: dotnet publish src/G3Windows/G3Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -o dist
      - name: Smoke test executable
        shell: pwsh
        run: |
          .\dist\G3Windows.exe help
          if ($LASTEXITCODE -ne 0) { throw 'help smoke test failed' }
          .\dist\G3Windows.exe guide
          if ($LASTEXITCODE -ne 0) { throw 'guide smoke test failed' }
      - name: Validate bundled migration tools
        shell: pwsh
        run: |
          python -m compileall -q upstream-g3-migrate
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax validation failed' }
          foreach ($name in @('init.py','enable.py','trigger.py','local_gateway_responder.py','local_ota_server.py')) { if (!(Test-Path (Join-Path upstream-g3-migrate $name))) { throw "Missing $name" } }
      - name: Package Windows executable and scripts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item dist/G3Windows.exe,prepare.ps1,start.ps1,stop.ps1,README.md package/
          Copy-Item upstream-g3-migrate package/upstream-g3-migrate -Recurse
          Compress-Archive -Path package/* -DestinationPath g3-windows-final-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: g3-windows-final-win-x64
          path: g3-windows-final-win-x64.zip
          if-no-files-found: error

      - name: Publish stable Windows download on GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-windows
          name: Latest Windows build
          body: |
            Automatically updated Windows x64 self-contained build from the latest successful main-branch workflow.
            Download g3-windows-final-win-x64.zip below. Extract and run G3Windows.exe.
            Includes pinned upstream migration scripts and NAS remote deployment of the initial NO-OTA stack. DNS, BLE provisioning and OTA remain separately gated.
          files: g3-windows-final-win-x64.zip
          make_latest: true
